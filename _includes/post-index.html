<h2 id="post-index-title" class="post-index-title">Posts</h2>
{% if site.posts.size > 0 %}
<nav aria-label="Blog posts">
  <ol class="post-index">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}"{% if page.url == post.url %} aria-current="page"{% endif %}>{{ post.title | escape }}</a>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %-d, %Y' }}</time>
    </li>
    {% endfor %}
  </ol>
</nav>
{% else %}
<p class="post-index-empty">No posts yet.</p>
{% endif %}
