<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% include head-custom.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <div class="masthead">
          <a class="site-name" href="{{ '/' | relative_url }}" aria-label="Joshua Gilligan, home">Joshua <em>Gilligan</em></a>
          <p class="masthead-note">AI &amp; mammalian <br>synthetic biology.<span>Stanford / Arc Institute</span></p>
        </div>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="{% if page.layout == 'post' %}true{% else %}page{% endif %}"{% endif %}>Blog</a>
          <a href="{{ '/cv.pdf' | relative_url }}">CV</a>
          <a href="https://github.com/joshgilligan17">GitHub</a>
        </nav>
      </header>
      <main id="main-content"{% if page.layout == 'post' %} class="reading-page"{% endif %} tabindex="-1">
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>Joshua Gilligan</span>
        <span>{{ site.time | date: '%Y' }}</span>
      </footer>
    </div>
  </body>
</html>
