---
layout: personal
---
<article>
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <p><time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
<a class="back-link" href="{{ '/blog/' | relative_url }}">Back to the blog</a>
